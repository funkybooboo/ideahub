services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/src:/app/src
      - ./backend/import_map.json:/app/import_map.json
      - ./backend/deno.json:/app/deno.json
      - backend-db:/app/data
    ports:
      - "${PORT:-8000}:8000"
    command:
      - deno
      - run
      - --allow-net
      - --allow-read
      - --allow-write
      - --allow-ffi
      - --allow-env
      - --import-map=import_map.json
      - --watch
      - src/mod.ts
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    env_file:
      - ./frontend/.env
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-db:
